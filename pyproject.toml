[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-automation"
version = "1.0.0"
description = "Intelligent workflow automation system with scheduled jobs, triggers, and configurable workflows"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "schedule>=1.2.0",
    "watchdog>=3.0.0",
    "aiohttp>=3.9.0",
    "croniter>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
workflow = "workflow_automation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
